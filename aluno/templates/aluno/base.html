{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Alunos{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'aluno/css/style.css' %}">
</head>

<body>

<header>
    <div class="container">
        <h1>Sistema de Alunos</h1>
        <nav>
            <a href="{% url 'lista_alunos' %}">Home</a>
        </nav>
    </div>
</header>

<main>
    <div class="container">

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>
</main>

</body>
</html>
